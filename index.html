:root{
  --font:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --ink:#20325b; --ink-soft:#4b5f8f;
  --gold:#ffc93c; --gold-2:#ff9e18; --gold-hi:#ffe9a8;
  --silver:#cfd8e6; --silver-2:#9fb0c8;
  --bronze:#e6a066; --bronze-2:#c47a3d;
  --paper:#ffffff;
  --sky-1:#8fd8ff; --sky-2:#c9efff;
  --grass:#3fbf6a;
  --accent:#2E86DE; --accent-2:#1c66b8; --accent-soft:#eaf3ff;
  --ok:#33c26b; --no:#ff6f6f;
  --pink:#ff5e9a; --purple:#8a5cff; --orange:#ff8a3d;
  --shadow:0 10px 0 rgba(20,40,80,.14), 0 18px 34px rgba(20,40,80,.22);
  --shadow-sm:0 6px 0 rgba(20,40,80,.12), 0 10px 20px rgba(20,40,80,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--font); color:var(--ink);
  background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 60%,#eafff1);
  -webkit-user-select:none; user-select:none;
  overscroll-behavior:none; touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:640px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- generic controls ---------- */
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
.btn{border-radius:22px;font-weight:600;padding:16px 22px;font-size:20px;background:#fff;color:var(--ink);
  box-shadow:var(--shadow-sm);transition:transform .08s}
.btn:active{transform:translateY(3px)}
.btn-accent{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.12)}
.icon-btn{width:54px;height:54px;border-radius:18px;background:#ffffffcc;box-shadow:var(--shadow-sm);
  display:grid;place-items:center;font-size:26px}
.icon-btn:active{transform:translateY(3px)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.topbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
  padding:8px 15px;font-weight:600;box-shadow:var(--shadow-sm);font-size:19px}

/* ---------- home ---------- */
.hero{padding:6px 18px 2px;text-align:center}
.hero h1{margin:2px 0 0;font-weight:600;font-size:34px;letter-spacing:.3px;
  color:#fff;text-shadow:0 3px 0 #2a68c6, 0 6px 12px rgba(0,0,0,.18)}
.hero .sub{color:#12518f;font-weight:500;font-size:16px;margin-top:2px}
.hub{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 22px;-webkit-overflow-scrolling:touch}
.zone-card{position:relative;border-radius:30px;padding:20px;margin:16px 0;overflow:hidden;
  box-shadow:var(--shadow);color:#fff;min-height:150px;display:flex;align-items:center;gap:16px}
.zone-card:active{transform:translateY(3px)}
.zone-card .zbig{font-size:74px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));flex:0 0 auto}
.zone-card .zinfo{flex:1;z-index:2}
.zone-card .zsub{opacity:.95;font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:1px}
.zone-card .ztitle{font-weight:600;font-size:26px;margin:2px 0 8px;line-height:1.05;
  text-shadow:0 3px 0 rgba(0,0,0,.16)}
.zbar{height:14px;border-radius:999px;background:rgba(255,255,255,.35);overflow:hidden}
.zbar > i{display:block;height:100%;border-radius:999px;background:#fff;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.zmeta{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600;font-size:15px}
.z-basket{background:linear-gradient(150deg,#ffa657,#e85d1b)}
.z-foot{background:linear-gradient(150deg,#4bd07f,#189e50)}
.z-tennis{background:linear-gradient(150deg,#3aa0ef,#1f5fbf)}
.court-lines{position:absolute;inset:0;opacity:.16;z-index:1}

/* mascot */
.mascot{width:118px;height:118px;margin:2px auto -6px;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.mascot.cheer{animation:cheer .5s ease infinite}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(-6deg) scale(1)}50%{transform:translateY(-16px) rotate(6deg) scale(1.06)}}

/* ---------- activity ---------- */
.act{flex:1;display:flex;flex-direction:column;min-height:0}
.instruction{display:flex;align-items:center;gap:12px;margin:2px 16px 6px;background:#ffffffe6;border-radius:22px;
  padding:12px 14px;box-shadow:var(--shadow-sm)}
.instruction .txt{flex:1;font-weight:600;font-size:20px;line-height:1.15}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:6px 16px;min-height:0}
.stimulus{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;max-width:100%}
.ball{width:56px;height:56px;animation:drop .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.bigtxt{font-weight:600;font-size:96px;color:var(--ink);text-shadow:0 4px 0 rgba(20,40,80,.12)}
.emoji-big{font-size:120px;line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 16px 18px}
.options.three{grid-template-columns:repeat(3,1fr)}
.opt{border-radius:26px;background:#fff;box-shadow:var(--shadow);min-height:96px;display:grid;place-items:center;
  font-weight:600;font-size:46px;color:var(--ink);transition:transform .08s;position:relative}
.opt .oemoji{font-size:64px}
.opt .oword{font-size:34px}
.opt:active{transform:translateY(4px)}
.opt.good{animation:goodpop .5s ease both;background:linear-gradient(180deg,#eaffef,#c8f7d6);color:#149a4c}
.opt.bad{animation:shake .4s ease both;background:#ffecec}
@keyframes goodpop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.twogroups{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 16px 18px}
.tg{border-radius:26px;background:#fff;box-shadow:var(--shadow);padding:14px;min-height:150px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.tg:active{transform:translateY(4px)}
.tg .ball{width:44px;height:44px}

/* progress dots */
.progress{display:flex;gap:7px;justify-content:center;padding:8px}
.progress i{width:12px;height:12px;border-radius:50%;background:#ffffff80;box-shadow:inset 0 0 0 2px #ffffff}
.progress i.done{background:var(--ok)}
.progress i.cur{background:#fff;transform:scale(1.25)}

/* order mode */
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{width:74px;height:88px;border-radius:20px;border:4px dashed #ffffffbe;background:#ffffff55;
  display:grid;place-items:center;font-weight:600;font-size:44px;color:var(--ink)}
.slot.filled{background:#fff;border-style:solid;border-color:var(--ok);animation:goodpop .4s ease both}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:8px 16px 20px}
.tile{min-width:74px;height:88px;padding:0 12px;border-radius:20px;background:#fff;box-shadow:var(--shadow);
  display:grid;place-items:center;font-weight:600;font-size:44px;color:var(--ink)}
.tile:active{transform:translateY(4px)}
.tile.used{opacity:0;pointer-events:none;transform:scale(.5)}
.tile.wrong{animation:shake .4s ease both}

/* trace mode */
.trace-wrap{position:relative;width:min(88vw,360px);aspect-ratio:5/6;margin:0 auto;
  background:#fff;border-radius:30px;box-shadow:var(--shadow);overflow:hidden}
.trace-guide{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;
  font-size:min(60vw,240px);color:#e7eefc;line-height:1}
.trace-guide.dashed{color:transparent;-webkit-text-stroke:6px #d7e3f7}
.trace-canvas{position:absolute;inset:0;touch-action:none}
.trace-ring{position:absolute;top:12px;right:12px;width:56px;height:56px}
.follow-ball{position:absolute;width:46px;height:46px;pointer-events:none;transform:translate(-50%,-50%);
  transition:opacity .2s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}

/* reward overlay */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;background:radial-gradient(circle at 50% 30%,#ffffffee,#dff0ffee);animation:screenIn .3s ease both;padding:24px}
.cup-hero{width:190px;height:190px;animation:cupRise .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes cupRise{from{transform:translateY(60px) scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.stars-row{display:flex;gap:10px;margin:6px 0}
.star{width:56px;height:56px;opacity:0;transform:scale(.2)}
.star.on{animation:starPop .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes starPop{to{opacity:1;transform:none}}
.reward-title{font-size:34px;font-weight:600;color:var(--ink);text-align:center;text-shadow:0 3px 0 #fff}
.reward-sub{font-size:19px;color:var(--ink-soft);font-weight:500;text-align:center;margin-top:-2px}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* vitrine */
.shelf{padding:10px 16px 22px;overflow-y:auto;flex:1}
.shelf h2{color:var(--ink);margin:14px 4px 8px;font-weight:600;font-size:22px;display:flex;gap:8px;align-items:center}
.cupgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cupcell{background:#fff;border-radius:22px;box-shadow:var(--shadow-sm);padding:12px 8px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:128px;justify-content:center}
.cupcell.locked{background:#eef3fb;color:#a9b7cf}
.cupcell .cname{font-size:13px;font-weight:600;line-height:1.1}
.cupcell svg,.cupcell .lockico{width:64px;height:64px}
.cupcell.locked svg{opacity:.35;filter:grayscale(1)}

/* name / settings */
.sheet{position:fixed;inset:0;z-index:70;background:#0b1f45cc;display:flex;align-items:flex-end;
  animation:screenIn .25s ease both}
.sheet .card{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:30px 30px 0 0;padding:22px 20px 30px}
.sheet h3{margin:0 0 14px;font-size:24px;font-weight:600}
.field{display:flex;gap:10px;margin:12px 0}
.field input{flex:1;font-family:inherit;font-size:22px;padding:14px 16px;border-radius:18px;border:3px solid #d7e3f7;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:2px solid #eef2f9}
.toggle{width:64px;height:36px;border-radius:999px;background:#d7e3f7;position:relative;transition:.2s}
.toggle.on{background:var(--ok)}
.toggle b{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.toggle.on b{left:32px}

.speaker{animation:none}
.speaker.playing{animation:pulse .8s ease infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.floatie{position:fixed;font-size:40px;pointer-events:none;z-index:65;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-90px) scale(1.4);opacity:0}}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style>

<body>

<script>
"use strict";
/* ============================================================
   CHAMPIONS DU CP — appli d'apprentissage hors-ligne (CP, 4 premiers mois)
   Thèmes sportifs : Basket→Maths · Foot→Écriture · Tennis→Lecture
   ============================================================ */

/* -------------------- persistance sûre -------------------- */
var mem={};
var Store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return (k in mem)?mem[k]:d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;}}
};
var state=Store.get('cp_state',{best:{},name:'',muted:false,seen:false});
function save(){Store.set('cp_state',state);}

/* -------------------- audio (offline) -------------------- */
var AC=null, voiceFR=null, ttsReady=false;
function unlockAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function beep(freqs,dur,type){
  if(state.muted||!AC)return;
  var t=AC.currentTime;
  freqs.forEach(function(f,i){
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    o.connect(g);g.connect(AC.destination);
    var s=t+i*0.09;
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.22,s+.02);
    g.gain.exponentialRampToValueAtTime(.001,s+(dur||.28));
    o.start(s);o.stop(s+(dur||.28)+.02);
  });
}
var sfx={
  good:function(){beep([660,880,1175],.22,'triangle');},
  win:function(){beep([523,659,784,1047,1319],.28,'triangle');},
  nope:function(){beep([300,220],.18,'sine');},
  tap:function(){beep([520],.08,'sine');},
  star:function(){beep([880,1320],.16,'triangle');}
};
function pickVoice(){
  if(!('speechSynthesis'in window))return;
  var vs=speechSynthesis.getVoices();
  voiceFR=vs.filter(function(v){return /fr(-|_)?/i.test(v.lang);})
            .sort(function(a,b){return (/fr-FR/i.test(b.lang)?1:0)-(/fr-FR/i.test(a.lang)?1:0);})[0]||null;
  ttsReady=true;
}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,cb){
  if(state.muted||!('speechSynthesis'in window)||!text){if(cb)cb();return;}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='fr-FR';u.rate=.92;u.pitch=1.08;
    if(voiceFR)u.voice=voiceFR;
    if(cb)u.onend=cb;
    speechSynthesis.speak(u);
  }catch(e){if(cb)cb();}
}
function stopSpeak(){try{speechSynthesis.cancel();}catch(e){}}

/* -------------------- utilitaires -------------------- */
function $(s,r){return (r||document).querySelector(s);}
function h(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[rand(0,a.length-1)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rand(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function uniqNums(n,min,max,not){var s=[],g=0;while(s.length<n&&g<200){g++;var x=rand(min,max);if(s.indexOf(x)<0&&(!not||not.indexOf(x)<0))s.push(x);}return s;}

/* -------------------- SVG art -------------------- */
function svgBall(kind){
  if(kind==='foot')return '<svg class="ball" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fff" stroke="#2b3550" stroke-width="2.5"/><path d="M32 14l9 6-3 11H26l-3-11z" fill="#2b3550"/><path d="M32 14V6M41 20l7-4M38 31l6 8M26 31l-6 8M23 20l-7-4" stroke="#2b3550" stroke-width="2.4" fill="none"/></svg>';
  if(kind==='tennis')return '<svg class="ball" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#d7f25a" stroke="#a9c72e" stroke-width="2"/><path d="M12 20c14 6 14 18 0 24M52 20c-14 6-14 18 0 24" stroke="#fff" stroke-width="4" fill="none"/></svg>';
  return '<svg class="ball" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#ff8a3d" stroke="#c85a12" stroke-width="2"/><path d="M32 2v60M2 32h60M9 11c16 8 30 22 44 42M55 11C39 19 25 33 11 53" stroke="#7a3506" stroke-width="2.4" fill="none"/></svg>';
}
function svgShape(kind,color){
  color=color||'#ff8a3d';
  if(kind==='circle')return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="'+color+'"/></svg>';
  if(kind==='triangle')return '<svg viewBox="0 0 100 100"><polygon points="50,10 90,86 10,86" fill="'+color+'"/></svg>';
  if(kind==='rect')return '<svg viewBox="0 0 100 100"><rect x="10" y="28" width="80" height="44" rx="6" fill="'+color+'"/></svg>';
  return '<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="6" fill="'+color+'"/></svg>';
}
function svgDots(n){ /* constellation like a die/board */
  var pos={1:[[50,50]],2:[[30,30],[70,70]],3:[[28,28],[50,50],[72,72]],
    4:[[30,30],[70,30],[30,70],[70,70]],5:[[30,30],[70,30],[50,50],[30,70],[70,70]],
    6:[[30,26],[70,26],[30,50],[70,50],[30,74],[70,74]],
    7:[[30,24],[70,24],[30,50],[50,50],[70,50],[30,76],[70,76]],
    8:[[30,22],[50,22],[70,22],[30,50],[70,50],[30,78],[50,78],[70,78]],
    9:[[28,24],[50,24],[72,24],[28,50],[50,50],[72,50],[28,76],[50,76],[72,76]],
    10:[[28,20],[50,20],[72,20],[28,44],[50,44],[72,44],[28,68],[50,68],[72,68],[50,88]]};
  var p=pos[n]||pos[6],c='';
  for(var i=0;i<p.length;i++)c+='<circle cx="'+p[i][0]+'" cy="'+p[i][1]+'" r="9" fill="#ff5e9a"/>';
  return '<svg viewBox="0 0 100 100" style="width:150px;height:150px;background:#fff;border-radius:22px;box-shadow:var(--shadow-sm)">'+c+'</svg>';
}
function cupSVG(tier){
  var g={gold:['#ffe9a8','#ffc93c','#ff9e18'],silver:['#f2f6fc','#cfd8e6','#9fb0c8'],bronze:['#f6ddc4','#e6a066','#c47a3d']}[tier]||['#ffe9a8','#ffc93c','#ff9e18'];
  return '<svg viewBox="0 0 100 120"><defs><linearGradient id="cg'+tier+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+g[0]+'"/><stop offset=".5" stop-color="'+g[1]+'"/><stop offset="1" stop-color="'+g[2]+'"/></linearGradient></defs>'
    +'<path d="M22 16h56v10c0 22-12 34-28 34S22 48 22 26z" fill="url(#cg'+tier+')" stroke="#00000022" stroke-width="1.5"/>'
    +'<path d="M22 20c-12 0-16 8-16 14 0 8 8 12 16 12" fill="none" stroke="'+g[2]+'" stroke-width="6"/>'
    +'<path d="M78 20c12 0 16 8 16 14 0 8-8 12-16 12" fill="none" stroke="'+g[2]+'" stroke-width="6"/>'
    +'<rect x="44" y="58" width="12" height="18" fill="'+g[1]+'"/>'
    +'<rect x="30" y="76" width="40" height="10" rx="4" fill="'+g[2]+'"/>'
    +'<rect x="26" y="86" width="48" height="14" rx="5" fill="'+g[1]+'"/>'
    +'<circle cx="50" cy="34" r="12" fill="#ffffff55"/><path d="M50 26l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#fff"/></svg>';
}
function starSVG(){return '<svg viewBox="0 0 24 24" fill="#ffc93c" stroke="#ff9e18" stroke-width="1"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>';}
function ring(pct){var r=24,c=2*Math.PI*r;return '<svg class="trace-ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="#fff" stroke="#e7eefc" stroke-width="7"/><circle cx="28" cy="28" r="24" fill="none" stroke="#33c26b" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'" transform="rotate(-90 28 28)"/></svg>';}
function mascotSVG(cls){
  cls=cls||'';
  return '<svg class="mascot '+cls+'" viewBox="0 0 120 120">'
    +'<ellipse cx="60" cy="110" rx="30" ry="6" fill="#00000018"/>'
    +'<path d="M60 8l13.5 27.4 30.2 4.4-21.9 21.3 5.2 30.1L60 76.9 32.8 91.2l5.2-30.1L16.1 39.8l30.2-4.4z" fill="#ffce3a" stroke="#f2a71b" stroke-width="3" stroke-linejoin="round"/>'
    +'<rect x="38" y="40" width="44" height="12" rx="6" fill="#2E86DE"/>'
    +'<circle cx="50" cy="60" r="7" fill="#fff"/><circle cx="70" cy="60" r="7" fill="#fff"/>'
    +'<circle cx="51" cy="61" r="3.4" fill="#20325b"/><circle cx="71" cy="61" r="3.4" fill="#20325b"/>'
    +'<circle cx="42" cy="70" r="5" fill="#ff9db0"/><circle cx="78" cy="70" r="5" fill="#ff9db0"/>'
    +'<path d="M50 74q10 9 20 0" fill="none" stroke="#20325b" stroke-width="3.4" stroke-linecap="round"/>'
    +'</svg>';
}

/* -------------------- contenu / programme CP -------------------- */
var VOWELS=['a','e','i','o','u'];
var CONS=['l','m','r','s','f','t','n','p','v','d'];
var SYLL=['ma','mi','mo','mu','la','li','lo','ra','ri','ro','sa','si','so','fu','lu','ni','pa','to','ve','de'];
// mots avec image (emoji) — pour lecture / phonologie
var WORDS=[
  {w:'moto',e:'🏍️',first:'m'},{w:'lune',e:'🌙',first:'l'},{w:'rat',e:'🐀',first:'r'},
  {w:'vélo',e:'🚲',first:'v'},{w:'sac',e:'🎒',first:'s'},{w:'robe',e:'👗',first:'r'},
  {w:'pomme',e:'🍎',first:'p'},{w:'tomate',e:'🍅',first:'t'},{w:'fusée',e:'🚀',first:'f'},
  {w:'livre',e:'📖',first:'l'},{w:'main',e:'✋',first:'m'},{w:'nid',e:'🪺',first:'n'},
  {w:'dé',e:'🎲',first:'d'},{w:'pizza',e:'🍕',first:'p'},{w:'souris',e:'🐭',first:'s'},
  {w:'feu',e:'🔥',first:'f'},{w:'nez',e:'👃',first:'n'},{w:'ananas',e:'🍍',first:'a'}
];
var SYLLWORDS=[ // comptage de syllabes (syllabes orales standard au CP)
  {w:'chat',e:'🐱',n:1},{w:'moto',e:'🏍️',n:2},{w:'ballon',e:'⚽',n:2},{w:'tortue',e:'🐢',n:2},
  {w:'lapin',e:'🐰',n:2},{w:'chocolat',e:'🍫',n:3},{w:'papillon',e:'🦋',n:3},{w:'éléphant',e:'🐘',n:3},
  {w:'kangourou',e:'🦘',n:3},{w:'ordinateur',e:'💻',n:4}
];
var SHAPES=[{k:'square',n:'carré'},{k:'circle',n:'rond'},{k:'triangle',n:'triangle'},{k:'rect',n:'rectangle'}];

/* ---- générateurs de questions maths ---- */
function optsFromNumber(correct,min,max){
  var o=uniqNums(2,Math.max(min,correct-3),Math.min(max,correct+3),[correct]);
  return shuffle([correct].concat(o)).map(function(v){return {label:''+v,speak:''+v,correct:v===correct,kind:'num'};});
}
function gCount(min,max){return function(){
  var n=rand(min,max),repr=pick(['balls','dots','balls']);
  var stim=repr==='dots'?{type:'dots',n:n}:{type:'balls',n:n,ball:'basket'};
  return {instruction:'Compte les ballons.',speak:'Compte les ballons, puis touche le bon nombre.',
    stimulus:stim,options:optsFromNumber(n,0,max),layout:'options',cols:3};
};}
function gAdd(maxSum){return function(){
  var a=rand(1,Math.min(6,maxSum-1)),b=rand(1,maxSum-a);
  return {instruction:'Combien de points en tout ?',speak:a+' plus '+b+'. Combien ça fait en tout ?',
    stimulus:{type:'add',a:a,b:b},options:optsFromNumber(a+b,0,maxSum+2),layout:'options',cols:3};
};}
function gComplement(target){return function(){
  var a=rand(1,target-1);
  return {instruction:'Combien pour faire '+target+' ?',speak:'Il y a déjà '+a+' ballons. Combien il en faut pour faire '+target+' ?',
    stimulus:{type:'complement',a:a,target:target},options:optsFromNumber(target-a,0,target),layout:'options',cols:3};
};}
function gCompare(max){return function(){
  var v=uniqNums(2,1,max),more=Math.random()<.5;
  var target=more?Math.max(v[0],v[1]):Math.min(v[0],v[1]);
  return {instruction:more?'Touche l\u2019équipe qui a le PLUS de ballons.':'Touche l\u2019équipe qui a le MOINS de ballons.',
    speak:more?'Touche l\u2019équipe qui a le plus de ballons.':'Touche l\u2019équipe qui a le moins de ballons.',
    layout:'twogroups',groups:[{n:v[0],val:v[0]},{n:v[1],val:v[1]}],correctVal:target};
};}
function gShape(){return function(){
  var t=pick(SHAPES),cols=['#ff8a3d','#3aa0ef','#33c26b','#ff5e9a'];
  var opts=shuffle(SHAPES).map(function(s,i){return {shape:s.k,color:cols[i%4],correct:s.k===t.k,kind:'shape'};});
  return {instruction:'Touche le '+t.n+'.',speak:'Touche le '+t.n+'.',stimulus:null,options:opts,layout:'options',cols:2};
};}

/* ---- générateurs lecture ---- */
function gVowel(){return function(){
  var t=pick(VOWELS),o=shuffle([t].concat(uniqPick(VOWELS,2,[t])));
  return {instruction:'Écoute et touche la lettre.',speak:'Touche la lettre '+t+' .',
    stimulus:null,options:shuffle(o).map(function(l){return {label:l,speak:l,correct:l===t,kind:'letter'};}),layout:'options',cols:3};
};}
function gSyll(){return function(){
  var t=pick(SYLL),o=shuffle([t].concat(uniqPick(SYLL,2,[t])));
  return {instruction:'Touche la syllabe que tu entends.',speak:'Touche la syllabe. '+t+' .',
    stimulus:null,options:shuffle(o).map(function(s){return {label:s,speak:s,correct:s===t,kind:'syll'};}),layout:'options',cols:3};
};}
function gFirstLetter(){return function(){
  var word=pick(WORDS),letters=[word.first].concat(uniqPick(CONS.concat(VOWELS),2,[word.first]));
  return {instruction:'Quelle est la première lettre ?',speak:'Écoute le mot. '+word.w+'. Quelle est la première lettre ?',
    stimulus:{type:'emoji',e:word.e},sayStim:word.w,
    options:shuffle(letters).map(function(l){return {label:l,speak:l,correct:l===word.first,kind:'letter'};}),layout:'options',cols:3};
};}
function gSameStart(){return function(){
  var ref=pick(WORDS);
  var same=WORDS.filter(function(x){return x.first===ref.first&&x.w!==ref.w;});
  if(!same.length)return gSameStart()();
  var good=pick(same),bad=uniqPick(WORDS.filter(function(x){return x.first!==ref.first;}),2,[]);
  var opts=shuffle([good].concat(bad));
  return {instruction:'Trouve le mot qui commence PAREIL.',speak:'Écoute. '+ref.w+'. Trouve le mot qui commence pareil.',
    stimulus:{type:'emoji',e:ref.e},sayStim:ref.w,
    options:opts.map(function(x){return {oemoji:x.e,speak:x.w,correct:x.first===ref.first,kind:'emoji'};}),layout:'options',cols:3};
};}
function gReadWord(){return function(){
  var word=pick(WORDS),bad=uniqPick(WORDS.filter(function(x){return x.w!==word.w;}),2,[]);
  var opts=shuffle([word].concat(bad));
  return {instruction:'Lis le mot et touche la bonne image.',speak:'Lis le mot, puis touche la bonne image.',
    stimulus:{type:'word',text:word.w},
    options:opts.map(function(x){return {oemoji:x.e,speak:x.w,correct:x.w===word.w,kind:'emoji'};}),layout:'options',cols:3};
};}
function gSyllCount(){return function(){
  var word=pick(SYLLWORDS);
  return {instruction:'Combien de syllabes ?',speak:'Combien de syllabes dans '+word.w+' ? Tape les syllabes.',
    stimulus:{type:'emoji',e:word.e},sayStim:word.w,
    options:shuffle([1,2,3,4]).map(function(n){return {label:''+n,speak:''+n,correct:n===word.n,kind:'num'};}),layout:'options',cols:2};
};}
function uniqPick(arr,n,not){var pool=shuffle(arr.filter(function(x){return not.indexOf(x)<0;}));return pool.slice(0,n);}

/* ============================ MOTEUR : lancement ============================ */
var session=null;
function startChallenge(z,c){
  session={z:z,c:c,idx:0,mistakes:0,total:0};
  if(c.mode==='quiz'){
    session.total=c.rounds;
    session.questions=[];for(var i=0;i<c.rounds;i++)session.questions.push(c.gen());
    renderQuestion();
  }else if(c.mode==='order'){
    session.total=c.rounds;
    session.questions=[];for(var j=0;j<c.rounds;j++)session.questions.push(c.gen());
    renderOrder();
  }else if(c.mode==='trace'){
    var glyphs=c.glyphs;
    if(glyphs==='NAME'){glyphs=(state.name||'').replace(/[^A-Za-zÀ-ÿ]/g,'').toUpperCase().split('');
      if(!glyphs.length){openNamePrompt(function(){startChallenge(z,c);});return;}}
    session.glyphs=glyphs;session.total=glyphs.length;
    renderTrace();
  }
}
function actShell(z){

function renderQuestion(){
  var z=session.z,q=session.questions[session.idx];
  var s=actShell(z);

  var instr=h('<div class="instruction"><div style="font-size:30px">'+session.c.icon+'</div><div class="txt">'+q.instruction+'</div></div>');
  act.appendChild(instr);
  var stage=h('<div class="stage"></div>');
  if(q.stimulus)stage.appendChild(renderStimulus(q.stimulus,z));
  act.appendChild(stage);

  if(q.layout==='twogroups'){
    var tg=h('<div class="twogroups"></div>');
    q.groups.forEach(function(g){
      var pnl=h('<div class="tg"></div>');
      for(var i=0;i<g.n;i++)pnl.appendChild(h(svgBall(z.ball)));
      pnl.onclick=function(){answerTwo(pnl,g.val,q);};
      tg.appendChild(pnl);
    });
    act.appendChild(tg);
  }else{
    var grid=h('<div class="options '+(q.cols===3?'three':'')+'"></div>');
    q.options.forEach(function(o){
      var b=h('<button class="opt"></button>');
      if(o.kind==='shape')b.innerHTML='<div style="width:70px;height:70px">'+svgShape(o.shape,o.color)+'</div>';
      else if(o.oemoji)b.innerHTML='<span class="oemoji">'+o.oemoji+'</span>';
      else if(o.kind==='letter'||o.kind==='syll')b.innerHTML='<span>'+o.label+'</span>';
      else b.innerHTML='<span>'+o.label+'</span>';
      b.onclick=function(){answerOpt(b,o,q);};
      grid.appendChild(b);
    });
    act.appendChild(grid);
  }
  s.appendChild(act);
  setScreen(s);
  drawProgress(session.idx,session.total);

}
function renderStimulus(st,z){

function afterCorrect(cb){

/* ---------------- ORDRE (ranger / former) ---------------- */
function renderOrder(){
  var z=session.z,q=session.questions[session.idx];
  var s=actShell(z);
  var act=h('<div class="act"></div>');
  act.appendChild(h('<div class="instruction"><div style="font-size:30px">'+session.c.icon+'</div><div class="txt">'+q.instruction+'</div></div>'));
  var stage=h('<div class="stage"></div>');
  var slots=h('<div class="slots"></div>');
  q.target.forEach(function(){slots.appendChild(h('<div class="slot"></div>'));});
  stage.appendChild(slots);
  act.appendChild(stage);
  var tiles=h('<div class="tiles"></div>');
  var placed=0;
  shuffle(q.target.map(function(v,i){return {v:v,i:i};})).forEach(function(tk){
    var t=h('<button class="tile">'+tk.v+'</button>');
    t.onclick=function(){
      unlockAudio();
      if(tk.v===q.target[placed]){
        var slot=slots.children[placed];slot.textContent=tk.v;slot.classList.add('filled');
        t.classList.add('used');sfx.tap();speak(tk.v);placed++;
        if(placed===q.target.length){speak('Bravo !');afterCorrect(nextQuestion);}
      }else{session.mistakes++;t.classList.add('wrong');sfx.nope();setTimeout(function(){t.classList.remove('wrong');},450);}
    };
    tiles.appendChild(t);
  });
  act.appendChild(tiles);
  s.appendChild(act);
  setScreen(s);
  drawProgress(session.idx,session.total);
  wireSpeaker(q.speak);
  setTimeout(function(){unlockAudio();speak(q.speak);},350);
}

/* ---------------- TRACÉ (écriture) ---------------- */
function renderTrace(){
  var z=session.z,glyph=session.glyphs[session.idx];
  var s=actShell(z);
  var act=h('<div class="act"></div>');
  act.appendChild(h('<div class="instruction"><div style="font-size:30px">✏️</div><div class="txt">Repasse sur la lettre avec ton doigt&nbsp;: <b>'+glyph+'</b></div></div>'));
  var stage=h('<div class="stage"></div>');
  var wrap=h('<div class="trace-wrap"></div>');
  wrap.appendChild(h('<div class="trace-guide dashed">'+glyph+'</div>'));
  var canvas=h('<canvas class="trace-canvas"></canvas>');
  wrap.appendChild(canvas);
  var ringBox=h('<div id="ringbox">'+ring(0)+'</div>');
  wrap.appendChild(ringBox);
  var fb=h('<div class="follow-ball" style="opacity:0">'+svgBall(z.ball)+'</div>');
  wrap.appendChild(fb);
  stage.appendChild(wrap);
  act.appendChild(stage);
  s.appendChild(act);
  setScreen(s);
  drawProgress(session.idx,session.total);
  wireSpeaker('Repasse sur la lettre '+glyph+' avec ton doigt.');
  setTimeout(function(){unlockAudio();speak('Repasse sur la lettre '+glyph+'.');},350);
  setupTracing(wrap,canvas,ringBox,fb,glyph,z);
}
function setupTracing(wrap,canvas,ringBox,fb,glyph,z){
  var rect,dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){
    rect=wrap.getBoundingClientRect();
    canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
  }
  size();
  var ctx=canvas.getContext('2d');if(!ctx)return;ctx.scale(dpr,dpr);
  ctx.lineWidth=26;ctx.lineJoin='round';ctx.lineCap='round';
  var grad=ctx.createLinearGradient(0,0,rect.width,rect.height);
  grad.addColorStop(0,'#ff5e9a');grad.addColorStop(.5,'#8a5cff');grad.addColorStop(1,z.accent);
  ctx.strokeStyle=grad;
  // masque de la lettre (offscreen) pour mesurer le recouvrement
  var mw=Math.round(rect.width/2),mh=Math.round(rect.height/2);
  var gm=document.createElement('canvas');gm.width=mw;gm.height=mh;
  var gc=gm.getContext('2d');
  gc.fillStyle='#000';gc.textAlign='center';gc.textBaseline='middle';
  gc.font='600 '+Math.round(mh*0.78)+'px Fredoka, sans-serif';
  gc.fillText(glyph,mw/2,mh/2+mh*0.03);
  var gd=gc.getImageData(0,0,mw,mh).data,glyphPix=0,idx=[];
  for(var i=3;i<gd.length;i+=4){if(gd[i]>40){glyphPix++;}}
  // masque de peinture
  var pm=document.createElement('canvas');pm.width=mw;pm.height=mh;
  var pc=pm.getContext('2d');pc.lineWidth=16;pc.lineJoin='round';pc.lineCap='round';pc.strokeStyle='#000';
  var drawing=false,last=null,plast=null,done=false;
  function pos(e){
    var t=e.touches?e.touches[0]:e;
    return {x:t.clientX-rect.left,y:t.clientY-rect.top};
  }
  function start(e){e.preventDefault();unlockAudio();drawing=true;last=pos(e);plast={x:last.x/2,y:last.y/2};
    fb.style.opacity=1;fb.style.left=last.x+'px';fb.style.top=last.y+'px';}
  function move(e){
    if(!drawing)return;e.preventDefault();var p=pos(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    var p2={x:p.x/2,y:p.y/2};
    pc.beginPath();pc.moveTo(plast.x,plast.y);pc.lineTo(p2.x,p2.y);pc.stroke();
    last=p;plast=p2;fb.style.left=p.x+'px';fb.style.top=p.y+'px';
  }
  function end(e){if(!drawing)return;drawing=false;fb.style.opacity=0;check();}
  function check(){
    if(done||!glyphPix)return;
    var pd=pc.getImageData(0,0,mw,mh).data,cov=0;
    for(var j=3;j<gd.length;j+=4){if(gd[j]>40&&pd[j]>40)cov++;}
    var pct=Math.min(1,cov/glyphPix/0.62); // 62% du tracé = réussi
    ringBox.innerHTML=ring(pct);
    if(pct>=1){done=true;fb.style.opacity=0;speak('Bravo !');afterCorrect(nextTrace);}
  }
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);
  canvas.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
}
function nextTrace(){
  session.idx++;
  if(session.idx>=session.total)finishChallenge();
  else renderTrace();
}

/* ============================ FIN / RÉCOMPENSE ============================ */
function finishChallenge(){
  var m=session.mistakes;
  var stars=m===0?3:(m<=2?2:1);
  var cid=session.c.id;
  var better=stars>starsFor(cid);
  if(better){state.best[cid]=stars;save();}
  var tier=stars>=3?'gold':stars>=2?'silver':'bronze';
  showReward(session.z,session.c,stars,tier,better);
}
function showReward(z,c,stars,tier,isNew){
  stopSpeak();
  var ov=h('<div class="overlay"></div>');
  ov.appendChild(h('<div class="reward-title">'+(isNew?'Nouvelle coupe&nbsp;!':'Bien joué&nbsp;!')+'</div>'));
  ov.appendChild(h('<div class="cup-hero">'+cupSVG(tier)+'</div>'));
  var row=h('<div class="stars-row"></div>');
  for(var i=0;i<3;i++)row.appendChild(h('<div class="star'+(i<stars?'':' off')+'">'+starSVG()+'</div>'));
  ov.appendChild(row);
  ov.appendChild(h('<div class="reward-sub">'+c.title+'</div>'));
  var btns=h('<div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center"></div>');
  var again=h('<button class="btn">🔁 Rejouer</button>');
  again.onclick=function(){ov.remove();sfx.tap();startChallenge(z,c);};
  var next=h('<button class="btn btn-accent">Continuer ➜</button>');
  next.onclick=function(){ov.remove();sfx.tap();
    if(zoneStars(z)===zoneMax(z))showZoneTrophy(z);else renderZone(z.id);};
  btns.appendChild(again);btns.appendChild(next);
  ov.appendChild(btns);
  document.body.appendChild(ov);
  // animation étoiles + son
  unlockAudio();sfx.win();
  var starEls=ov.querySelectorAll('.star');
  var k=0;(function pop(){if(k<stars){starEls[k].classList.add('on');sfx.star();k++;setTimeout(pop,320);}})();
  burstConfetti(1);
  setTimeout(function(){speak(isNew?'Bravo ! Tu as gagné une nouvelle coupe.':'Bien joué !');},500);
}
function showZoneTrophy(z){
  var ov=h('<div class="overlay"></div>');
  ov.appendChild(h('<div class="reward-title">Champion de '+z.subject+'&nbsp;!</div>'));
  ov.appendChild(h(mascotSVG('cheer').replace('class="mascot cheer"','class="mascot cheer" style="width:150px;height:150px"')));
  ov.appendChild(h('<div class="cup-hero" style="width:150px;height:150px">'+cupSVG('gold')+'</div>'));
  ov.appendChild(h('<div class="reward-sub">Tu as gagné toutes les étoiles de ce sport&nbsp;!</div>'));
  var next=h('<button class="btn btn-accent" style="margin-top:16px">Super&nbsp;! ➜</button>');
  next.onclick=function(){ov.remove();sfx.tap();renderZone(z.id);};
  ov.appendChild(next);
  document.body.appendChild(ov);
  unlockAudio();sfx.win();burstConfetti(1.4);
  setTimeout(function(){speak('Incroyable ! Tu es le champion de '+z.subject+' !');},400);
}

/* ============================ VITRINE DES COUPES ============================ */
function renderVitrine(){
  var s=h('<div class="screen"></div>');
  s.style.background='linear-gradient(180deg,#2E86DE,#164a95)';
  var top=h('<div class="topbar"></div>');
  var back=h('<button class="icon-btn">⬅️</button>');back.onclick=function(){sfx.tap();goHome();};
  top.appendChild(back);
  top.appendChild(h('<div class="grow" style="text-align:center;color:#fff;font-weight:600;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.2)">🏆 Ma Vitrine</div>'));
  top.appendChild(h('<div style="width:54px"></div>'));
  s.appendChild(top);
  var shelf=h('<div class="shelf" style="background:#eaf3ff"></div>');
  shelf.appendChild(h('<div style="text-align:center;color:var(--ink);font-weight:600;font-size:20px;margin:6px">'+totalCups()+' coupes · '+totalStars()+' étoiles</div>'));
  ZONES.forEach(function(z){
    shelf.appendChild(h('<h2>'+z.emoji+' '+z.title+'</h2>'));
    var grid=h('<div class="cupgrid"></div>');
    z.challenges.forEach(function(c){
      var tier=tierFor(c.id);

        grid.appendChild(h('<div class="cupcell">'+cupSVG(tier)+'<div class="cname">'+c.title+'</div></div>'));
      }else{
        grid.appendChild(h('<div class="cupcell locked"><div class="lockico" style="font-size:44px">🔒</div><div class="cname">'+c.title+'</div></div>'));
      }
    });
    shelf.appendChild(grid);
  });
  s.appendChild(shelf);
  setScreen(s);
}

/* ============================ CONFETTIS ============================ */
var confCanvas=$('#confetti'),cctx=confCanvas.getContext('2d'),confetti=[],confRAF=null;
function sizeConf(){confCanvas.width=innerWidth;confCanvas.height=innerHeight;}
sizeConf();window.addEventListener('resize',function(){sizeConf();});
function burstConfetti(power){
  if(!cctx)return;
  var cols=['#ffc93c','#ff5e9a','#8a5cff','#33c26b','#2E86DE','#ff8a3d'];
  var n=Math.round(50*power);
  for(var i=0;i<n;i++)confetti.push({
    x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*0.42,
    vx:(Math.random()-.5)*10,vy:-Math.random()*13-4,
    g:.4+Math.random()*.2,s:6+Math.random()*8,
    c:cols[rand(0,cols.length-1)],r:Math.random()*6,vr:(Math.random()-.5)*.5,life:60+Math.random()*40
  });
  if(!confRAF)confLoop();
}
function confLoop(){
  if(!cctx)return;
  cctx.clearRect(0,0,confCanvas.width,confCanvas.height);
  for(var i=confetti.length-1;i>=0;i--){
    var p=confetti[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.r);cctx.fillStyle=p.c;
    cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cctx.restore();
    if(p.life<=0||p.y>confCanvas.height+20)confetti.splice(i,1);
  }
  if(confetti.length)confRAF=requestAnimationFrame(confLoop);
  else{confRAF=null;cctx.clearRect(0,0,confCanvas.width,confCanvas.height);}
}
function floatEmoji(anchor,e){
  var r=anchor.getBoundingClientRect();
  var f=h('<div class="floatie" style="left:'+(r.left+r.width/2-20)+'px;top:'+(r.top)+'px">'+e+'</div>');
  document.body.appendChild(f);setTimeout(function(){f.remove();},1000);
}
