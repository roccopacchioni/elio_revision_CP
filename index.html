<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5BC8F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Champions du CP</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --sky:#5BC8F5; --sky2:#8FDCFB;
  --sun:#FFC93C; --coral:#FF6B6B; --mint:#3ED598;
  --ink:#22314E; --ink2:#42557A;
  --cream:#FFF7E8; --card:#FFFFFF;
  --gold:#FFCE3A; --gold2:#E8A400;
  --bball:#F2872B; --bball2:#C85C12;      /* basket / maths */
  --foot:#2FA45B;  --foot2:#1C7A3E;       /* foot / écriture */
  --tennis:#B7E23A;--tennis2:#3E8BC7;     /* tennis / lecture */
  --shadow:0 8px 0 rgba(0,0,0,.14);
  --font:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:var(--font)}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation}
body{
  background:
    radial-gradient(120% 90% at 50% -10%, #BDEBFF 0%, var(--sky) 45%, #37B0E8 100%) fixed;
  color:var(--ink); user-select:none; -webkit-user-select:none;
  min-height:100dvh; overflow-x:hidden;
}
#app{max-width:640px;margin:0 auto;min-height:100dvh;position:relative;padding:0 16px 28px;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ---------- generic building blocks ---------- */
h1,h2,h3{margin:0;line-height:1.05;letter-spacing:.5px}
.btn{
  border:none;cursor:pointer;font-weight:800;color:#fff;border-radius:22px;
  padding:16px 22px;font-size:20px;box-shadow:var(--shadow);
  transition:transform .08s ease, filter .1s ease; position:relative;
}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.btn.big{font-size:24px;padding:20px 26px;width:100%}
.btn-yellow{background:linear-gradient(180deg,#FFDD63,#FFC121);color:#6b4a00}
.btn-green{background:linear-gradient(180deg,#54D08A,var(--foot))}
.btn-coral{background:linear-gradient(180deg,#FF8A8A,#FF5A5A)}
.btn-sky{background:linear-gradient(180deg,#7FD6FA,#2FA9E8)}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.10)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 2px 6px;position:sticky;top:0;z-index:20}
.topbar .spacer{flex:1}
.icon-btn{width:52px;height:52px;border-radius:18px;border:none;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.12);
  font-size:26px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.counter{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 14px 8px 10px;font-weight:900;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.counter .em{font-size:24px}

/* ---------- home ---------- */
.hero{
  margin:6px 0 4px;text-align:center;position:relative;
  background:linear-gradient(180deg,#FFFDF6,#FFF1CF);border-radius:34px;padding:18px 16px 22px;
  box-shadow:0 10px 0 rgba(0,0,0,.10), inset 0 0 0 5px #fff;
}
.hero h1{font-size:34px;color:var(--ink)}
.hero .sub{font-weight:800;color:var(--ink2);font-size:16px;margin-top:4px}
.mascot{font-size:78px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18));display:inline-block}
.mascot.wave{animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg) translateY(-4px)}}

.sports{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.sport-card{
  border-radius:30px;padding:18px 18px;color:#fff;display:flex;align-items:center;gap:16px;
  box-shadow:0 9px 0 rgba(0,0,0,.16);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .08s ease;
}
.sport-card:active{transform:translateY(4px);box-shadow:0 5px 0 rgba(0,0,0,.16)}
.sport-card .emoji{font-size:56px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));flex:0 0 auto}
.sport-card .txt{flex:1;min-width:0}
.sport-card .txt .lbl{font-weight:900;font-size:26px;line-height:1}
.sport-card .txt .sublbl{font-weight:800;opacity:.95;font-size:15px;margin-top:3px}
.sport-card .prog{margin-top:9px;height:14px;border-radius:999px;background:rgba(255,255,255,.35);overflow:hidden}
.sport-card .prog i{display:block;height:100%;background:#fff;border-radius:999px;width:0;transition:width .5s ease}
.sc-basket{background:linear-gradient(135deg,#FFA94D,var(--bball) 55%,var(--bball2))}
.sc-foot{background:linear-gradient(135deg,#5BD08A,var(--foot) 55%,var(--foot2))}
.sc-tennis{background:linear-gradient(135deg,#CFEE5A,#7CC93E 50%,var(--tennis2))}
.sport-card .chev{font-size:30px;opacity:.9}
.sport-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}

.home-row{display:flex;gap:12px;margin-top:16px}
.home-row .tile{flex:1;background:#fff;border-radius:24px;padding:14px;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.10);cursor:pointer}
.home-row .tile .e{font-size:38px}
.home-row .tile .t{font-weight:900;margin-top:2px;color:var(--ink);font-size:15px}

/* ---------- sport screen ---------- */
.screen-head{border-radius:0 0 34px 34px;margin:0 -16px 12px;padding:16px 20px 20px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.screen-head.basket{background:linear-gradient(135deg,#FFA94D,var(--bball))}
.screen-head.foot{background:linear-gradient(135deg,#5BD08A,var(--foot))}
.screen-head.tennis{background:linear-gradient(135deg,#CFEE5A,#7CC93E,#3E8BC7)}
.screen-head h2{font-size:28px}
.screen-head .desc{font-weight:800;opacity:.95;margin-top:3px}
.acts{display:flex;flex-direction:column;gap:13px}
.act{
  background:#fff;border-radius:24px;padding:14px 14px;display:flex;align-items:center;gap:14px;
  box-shadow:0 7px 0 rgba(0,0,0,.10);cursor:pointer;transition:transform .08s ease;position:relative;
}
.act:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.10)}
.act .num{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;flex:0 0 auto}
.act .info{flex:1;min-width:0}
.act .info .name{font-weight:900;font-size:19px;color:var(--ink)}
.act .info .skill{font-weight:800;font-size:13px;color:var(--ink2)}
.act .cupbadge{font-size:30px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.act .cupbadge.empty{filter:grayscale(1);opacity:.28}
.act .stars{font-size:15px;letter-spacing:1px}

/* ---------- gameplay ---------- */
.play{flex:1;display:flex;flex-direction:column}
.play .qbar{display:flex;align-items:center;gap:10px;margin:6px 0 6px}
.pips{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.pip{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}
.pip.done{background:var(--gold);box-shadow:0 0 0 2px #fff, 0 3px 4px rgba(0,0,0,.2)}
.prompt{
  background:#fff;border-radius:30px;padding:18px 16px;text-align:center;box-shadow:0 9px 0 rgba(0,0,0,.10);
  margin-bottom:14px;position:relative
}
.prompt .say-again{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:16px;border:none;background:var(--sun);font-size:24px;box-shadow:0 4px 0 var(--gold2);cursor:pointer}
.prompt .say-again:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.prompt .q{font-weight:900;font-size:22px;color:var(--ink);margin:2px 24px 10px}
.visual{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center;min-height:60px}
.visual .big{font-size:64px;font-weight:900}
.ball{font-size:40px;animation:pop .3s ease both}
.ball:nth-child(2n){animation-delay:.05s}
.ball:nth-child(3n){animation-delay:.1s}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.groupbox{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.grp{background:var(--cream);border-radius:18px;padding:8px 10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;box-shadow:inset 0 0 0 3px #fff;max-width:46%}
.plus{font-size:40px;font-weight:900;color:var(--bball2)}

.options{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.options.col2{grid-template-columns:repeat(2,1fr)}
.options.col1{grid-template-columns:1fr}
.opt{
  border:none;border-radius:24px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.13);
  font-weight:900;color:var(--ink);cursor:pointer;padding:16px 8px;min-height:84px;
  display:flex;align-items:center;justify-content:center;transition:transform .08s ease;
  font-size:38px;line-height:1;
}
.opt.small{font-size:26px}
.opt:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.13)}
.opt.right{animation:goodPop .5s ease;background:linear-gradient(180deg,#B6F5C9,#54D08A);color:#0a5a2c}
.opt.wrong{animation:shake .4s ease;background:#FFE0E0}
@keyframes goodPop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shape{width:64px;height:64px}
.shape.rond{border-radius:50%}
.shape.carre{border-radius:10px}
.shape.rect{width:84px;height:52px;border-radius:10px}
.shape.tri{width:0;height:0;background:none!important;border-left:36px solid transparent;border-right:36px solid transparent}

/* order game */
.order-tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.otile{width:70px;height:70px;border-radius:20px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.13);font-size:34px;font-weight:900;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.otile.picked{background:linear-gradient(180deg,#B6F5C9,#54D08A);color:#0a5a2c;transform:translateY(3px);box-shadow:0 4px 0 rgba(0,0,0,.13)}
.otile.bad{animation:shake .4s ease;background:#FFE0E0}
.slots{display:flex;gap:8px;justify-content:center;margin:4px 0 14px}
.slot{width:56px;height:56px;border-radius:16px;border:4px dashed rgba(255,255,255,.8);display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff}
.slot.filled{border-style:solid;background:#fff;color:var(--ink)}

/* tracing */
.trace-wrap{background:#fff;border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.10);padding:10px;margin-bottom:12px}
#traceCanvas{width:100%;height:340px;border-radius:18px;background:
  linear-gradient(0deg, #eef6ff 0 100%);touch-action:none;display:block}
.trace-tools{display:flex;gap:10px;margin-top:10px}
.trace-tools .btn{flex:1;font-size:18px;padding:14px}
.covermeter{height:16px;border-radius:999px;background:#e7eefc;overflow:hidden;margin-top:8px}
.covermeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#2FA45B);transition:width .15s}

/* celebration overlay */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(20,30,55,.55);backdrop-filter:blur(2px)}
.reward{background:linear-gradient(180deg,#FFFEF8,#FFF0C9);border-radius:34px;padding:28px 24px 24px;text-align:center;max-width:380px;width:86%;box-shadow:0 14px 0 rgba(0,0,0,.22), inset 0 0 0 5px #fff;animation:dropin .5s cubic-bezier(.2,1.4,.5,1) both}
@keyframes dropin{from{transform:translateY(-120%) scale(.6);opacity:0}to{transform:none;opacity:1}}
.reward .trophy{font-size:96px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.22));animation:trophyBounce 1s ease infinite}
@keyframes trophyBounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.reward h2{font-size:30px;color:var(--ink);margin-top:6px}
.reward .stars-big{font-size:44px;margin:6px 0 2px;letter-spacing:4px}
.reward p{font-weight:800;color:var(--ink2);margin:4px 0 16px;font-size:17px}
.reward .earn{font-weight:900;font-size:19px;color:var(--bball2);margin-bottom:14px}

/* mini pop on correct answer */
.mini-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:55;pointer-events:none}
.mini-pop .word{font-size:42px;font-weight:900;color:#FFE39A;-webkit-text-stroke:2.5px var(--ink);white-space:nowrap;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}

/* confetti */
.confetti{position:fixed;top:-20px;font-size:26px;z-index:58;pointer-events:none;will-change:transform}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* name screen */
.name-screen{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:18px;padding:10px 6px 30px}
.name-screen .mascot{font-size:96px}
.name-screen input{font-family:var(--font);font-weight:900;font-size:26px;text-align:center;border:none;border-radius:22px;padding:18px;box-shadow:inset 0 0 0 4px var(--sun), 0 8px 0 rgba(0,0,0,.12);color:var(--ink)}
.name-screen input:focus{outline:none;box-shadow:inset 0 0 0 4px var(--coral), 0 8px 0 rgba(0,0,0,.12)}

/* cabinet */
.cab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.cab-cell{background:#fff;border-radius:22px;padding:12px 6px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.10)}
.cab-cell .c{font-size:42px}
.cab-cell.locked .c{filter:grayscale(1);opacity:.25}
.cab-cell .n{font-weight:800;font-size:12px;color:var(--ink2);margin-top:2px;min-height:26px;display:flex;align-items:center;justify-content:center}
.badge-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.badgechip{background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.10);display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.badgechip.locked{filter:grayscale(1);opacity:.35}
.section-title{font-weight:900;font-size:20px;margin:16px 4px 4px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}

.footer-note{text-align:center;color:rgba(255,255,255,.85);font-weight:800;font-size:12px;margin-top:18px}

/* ---------- balles de sport (SVG, indépendantes des emojis) ---------- */
.sball{display:inline-block;vertical-align:middle;line-height:0;animation:pop .3s ease both}
.sball:nth-child(2n){animation-delay:.05s}.sball:nth-child(3n){animation-delay:.1s}
.countrow{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;align-items:center;min-height:60px}
.onball{position:relative;display:inline-grid;place-items:center;line-height:0}
.onball .lab{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#fff;
  -webkit-text-stroke:1.5px rgba(0,0,0,.45);text-shadow:0 2px 3px rgba(0,0,0,.35)}
.opt .onball{pointer-events:none}
.grp .sball{animation:none}

/* petite scène de sport en haut du prompt */
.scene{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:-4px 0 6px;height:56px}
.scene .m{font-size:40px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2));animation:wave 2s ease-in-out infinite}
.scene svg{filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}

/* éclat d'étoiles au tap + flash d'écran */
.spark{position:fixed;z-index:57;font-size:26px;pointer-events:none;will-change:transform,opacity}
.flash{position:fixed;inset:0;z-index:52;pointer-events:none;opacity:0}
.flash.go{animation:flashGood .5s ease}
.flash.no{animation:flashBad .45s ease}
@keyframes flashGood{0%{opacity:0}30%{opacity:.35;background:radial-gradient(circle at 50% 42%,#8affc0,transparent 60%)}100%{opacity:0}}
@keyframes flashBad{0%{opacity:0}30%{opacity:.30;background:radial-gradient(circle at 50% 42%,#ffb3b3,transparent 60%)}100%{opacity:0}}

/* ballon qui monte au panier (mini-pop enrichi) */
.shot{position:fixed;left:50%;top:64%;z-index:56;pointer-events:none;line-height:0}
.mascotReact{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:56;font-size:78px;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.mascotReact.in{animation:mascotIn 1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes mascotIn{0%{transform:translate(-50%,120%) scale(.6)}45%{transform:translate(-50%,-8px) scale(1.08)}100%{transform:translate(-50%,0) scale(1)}}

/* tracé : boutons chemin */
.trace-legend{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:var(--ink2);font-size:13px;margin:2px 0 6px}
.trace-legend .dot{width:16px;height:16px;border-radius:50%;background:#2FA45B;box-shadow:0 0 0 3px #bff0cf}

/* ====== BONUS : défi dunk ====== */
.bonus{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 50% 0%,#FFE39A,#FFB24D 55%,#F2872B);overflow:hidden}
.bonus .bhead{display:flex;align-items:center;gap:10px;padding:16px 18px 6px;color:#7a3d00;font-weight:900}
.bonus .bhead .title{font-size:22px;flex:1}
.bonus .bskip{border:none;background:#fff;color:#b45309;border-radius:16px;font-weight:900;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.15);font-size:15px}
.bonus .bscore{background:#fff;color:#b45309;border-radius:16px;font-weight:900;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.15);font-size:18px}
#dunkCanvas{flex:1;width:100%;display:block;touch-action:none}
.bonus .bhint{text-align:center;color:#7a3d00;font-weight:900;padding:6px 10px 14px;font-size:16px}
.bintro{position:fixed;inset:0;z-index:72;display:grid;place-items:center;background:rgba(20,30,55,.5)}
.bintro .card{background:linear-gradient(180deg,#FFFEF8,#FFE9C2);border-radius:32px;padding:26px 24px;text-align:center;
  box-shadow:0 14px 0 rgba(0,0,0,.2),inset 0 0 0 5px #fff;animation:dropin .5s cubic-bezier(.2,1.4,.5,1) both;max-width:340px;width:86%}
.bintro .card .big{font-size:76px;animation:trophyBounce 1s ease infinite}
.bintro .card h2{font-size:26px;color:var(--ink);margin:6px 0}
.bintro .card p{font-weight:800;color:var(--ink2);margin:2px 0 4px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s!important;transition-duration:.05s!important}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* =========================================================================
   CHAMPIONS DU CP — appli d'apprentissage sportive, hors-ligne, en français.
   Basket = Maths | Foot = Écriture | Tennis = Lecture
   Programme des 4 premiers mois de CP.
   ========================================================================= */

/* ---------- petits utilitaires ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const app = $('#app');
const R = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick = a=>a[R(0,a.length-1)];
const uniqNums=(target,count,min,max)=>{const s=new Set([target]);let g=0;while(s.size<count&&g<300){g++;const n=R(min,max);if(n!==target)s.add(n);}return shuffle([...s]);};

/* ---------- stockage (persistant, avec repli mémoire) ---------- */
const Store=(()=>{
  let mem={};let ok=true;
  try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){ok=false;}
  return {
    get(k,d){try{if(ok){const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}}catch(e){}return (k in mem)?mem[k]:d;},
    set(k,v){try{if(ok){localStorage.setItem(k,JSON.stringify(v));return;}}catch(e){}mem[k]=v;}
  };
})();

let game = Store.get('championsCP', null) || {name:'', cups:{}, stars:{}, badges:[], sound:true, voice:true};
function save(){Store.set('championsCP', game);}

/* ---------- son (WebAudio) ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(freq,dur=0.12,type='sine',vol=0.18,when=0){
  if(!game.sound)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);
  const t=c.currentTime+when;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+0.02);
}

let frVoice=null;
function loadVoices(){
  const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  frVoice = vs.find(v=>/fr-FR/i.test(v.lang)) || vs.find(v=>/^fr/i.test(v.lang)) || null;
}

function say(text,{rate=0.92,pitch=1.12,then=null}={}){
  if(!window.speechSynthesis||!game.voice){if(then)setTimeout(then,300);return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='fr-FR';u.rate=rate;u.pitch=pitch;u.volume=1;
    if(frVoice)u.voice=frVoice;
    if(then)u.onend=then;
    speechSynthesis.speak(u);
  }catch(e){if(then)then();}
}

function lSyll(){ // fusionner consonne+voyelle
  const cons=['m','l','r','s','p','t','v','f','n'];const vow=['a','i','o','u','e'];
  return {type:'choice',columns:3,size:'syll',
    sayFn:d=>'Touche la syllabe '+d.ans+'.',
    q:'Trouve la syllabe&nbsp;!',
    build(){const c=pick(cons);const v=pick(vow);const ans=c+v;
      const others=new Set();while(others.size<2){const o=c+pick(vow);if(o!==ans)others.add(o);}
      // parfois changer la consonne
      const alt=pick(cons.filter(x=>x!==c))+v; others.add(alt);
      const opts=shuffle([ans,...[...others].slice(0,2)]);
      return {vis:onBall('tennis','?',110,44),opts,ans,say:ans};}
  };

  if(sport==='foot')return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#2b3a55" stroke-width="2"/><polygon points="${x},${y-r*0.5} ${x+r*0.5},${y-r*0.1} ${x+r*0.3},${y+r*0.5} ${x-r*0.3},${y+r*0.5} ${x-r*0.5},${y-r*0.1}" fill="#2b3a55"/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#F2872B" stroke="#8a3d0a" stroke-width="2"/><path d="M${x} ${y-r} V${y+r} M${x-r} ${y} H${x+r}" stroke="#7a3407" stroke-width="1.5"/>`;
}

/* contenu d'une option : posé sur une balle du sport quand c'est pertinent */
function optContent(o,def,sportId){
  if(def.render) return def.render(o);
  if(def.size==='shape') return shapeHTML(o);
  const v=(typeof o==='object')?(o.id||o.name):o;
  if(def.size==='word') return v; // les mots restent en texte
  if(sportId==='basket' && def.size==='num') return onBall('basket',v,74,32);
  if(sportId==='tennis') return onBall('tennis',v,74,def.size==='syll'?24:32);
  if(sportId==='foot'   && def.size==='letter') return onBall('foot',v,74,32);
  return v;
}

let session=null;

window.startActivity=function(sportId,actId){
  const s=SPORTMAP[sportId];const act=s.acts.find(a=>a.id===actId);
  const def=act.def();
  session={sportId,actId,act,def,i:0,total:act.rounds,correct:0,firstTry:0,tries:0,answeredThis:false,streak:0};
  if(def.type==='trace'){session.total=def.glyphs.length>act.rounds?act.rounds:def.glyphs.length;session.glyphs=shuffle(def.glyphs).slice(0,session.total);}
  ac(); // débloque l'audio au 1er tap

};

}

function showRound(){
  const {def}=session;
  if(def.type==='choice') return showChoice();
  if(def.type==='order')  return showOrder();
  if(def.type==='trace')  return showTrace();
}

/* ----- rounds de type choix ----- */
function showChoice(){
  const {def,act,sportId}=session;
  const d=def.build();session.d=d;session.answeredThis=false;session.roundWrong=0;
  const s=SPORTMAP[sportId];

    const sizeCls=(def.size==='word')?'small':(def.size==='syll'?'small':'');
    return `<button class="opt ${sizeCls}" data-v="${(''+raw).replace(/"/g,'&quot;')}" onclick='choiceAnswer(this)'>${optContent(o,def,sportId)}</button>`;
  }).join('');
  app.innerHTML=`${topbar("quitPlay()")}

        <div class="q">${q}</div>
      </div>
      <div class="options ${d.opts.length===2?'col2':(d.opts.length===1?'col1':'')} ${def.size==='word'?'col1':''}">${optHTML}</div>
    </div>`;

  if(def.size==='shape'){
    [...document.querySelectorAll('.opt')].forEach((btn,idx)=>{btn.innerHTML=shapeHTML(d.opts[idx]);btn.dataset.v=d.opts[idx].id;});
  }

}
window.repeatSay=function(){if(session&&session.sayText){say(session.sayText);} };

window.choiceAnswer=function(btn){
  if(session.answeredThis && btn.classList.contains('right'))return;
  const {d,def}=session;
  const val=btn.dataset.v;
  const ans=''+(d.ans);
  session.tries++;
  if(val===ans){
    if(!session.answeredThis){session.correct++;if(session.roundWrong===0)session.firstTry++;}
    session.answeredThis=true;
    btn.classList.remove('wrong');btn.classList.add('right');
    session.streak=(session.streak||0)+1;
    sfxCorrect();
    miniPop(session.sportId);
    try{const r=btn.getBoundingClientRect();starBurst(r.left+r.width/2,r.top+r.height/2);}catch(e){}
    say(pick(['Bravo !','Super !','Génial !','Bien joué !','Excellent !']));
    lockOptions();
    setTimeout(afterCorrect,1050);
  }else{
    session.roundWrong++;session.streak=0;
    btn.classList.add('wrong');
    sfxWrong();wrongPop();
    say(pick(['Essaie encore.','Presque !','Regarde bien.']));
    setTimeout(()=>btn.classList.remove('wrong'),450);
  }
};

/* ----- bibliothèque de tracés (squelettes une-ligne) -----
   Repère (boîte 100 x 140) : haut=16, capitale=18, hauteur d'x=54, ligne=110, jambage=138 */
const ASC=16, CAP=18, XT=54, BASE=110, DESC=138;
const GP=(x,y)=>({x,y}); const GD=Math.PI/180;
function gln(x1,y1,x2,y2,n=10){const a=[];for(let i=0;i<=n;i++){const t=i/n;a.push(GP(x1+(x2-x1)*t,y1+(y2-y1)*t));}return a;}
function garc(cx,cy,rx,ry,a0,a1,n=30){const a=[];for(let i=0;i<=n;i++){const t=i/n;const A=(a0+(a1-a0)*t)*GD;a.push(GP(cx+rx*Math.cos(A),cy+ry*Math.sin(A)));}return a;}
function gqb(p0,p1,p2,n=18){const a=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;a.push(GP(u*u*p0.x+2*u*t*p1.x+t*t*p2.x,u*u*p0.y+2*u*t*p1.y+t*t*p2.y));}return a;}
const GJ=(...segs)=>segs.flat();
const DIGITS={
 '0':[garc(50,82,20,30,-90,270)],
 '1':[GJ(gln(36,68,50,56),gln(50,56,50,110)), gln(36,110,64,110)],
 '2':[GJ(gqb(GP(32,72),GP(50,52),GP(66,72)), gqb(GP(66,72),GP(66,90),GP(34,110)), gln(34,110,70,110))],
 '3':[GJ(gqb(GP(34,66),GP(66,56),GP(54,80)), gqb(GP(54,80),GP(74,86),GP(52,106)), gqb(GP(52,106),GP(38,112),GP(30,98)))],
 '4':[gln(60,56,30,94), gln(30,94,72,94), gln(60,72,60,110)],
 '5':[GJ(gln(62,58,38,58), gln(38,58,37,82), gqb(GP(37,82),GP(66,74),GP(64,96)), gqb(GP(64,96),GP(60,112),GP(34,104)))],
 '6':[GJ(gqb(GP(64,60),GP(36,54),GP(32,86)), garc(48,94,16,16,180,180-360,30))],
 '7':[gln(34,58,70,58), gln(70,58,44,110)],
 '8':[garc(50,70,15,15,-90,270), garc(50,95,18,17,-90,270)],
 '9':[GJ(garc(50,72,18,16,-180,180,30), gln(66,72,52,110))]
};
const LOWER={
 'i':[GJ(gln(30,BASE,44,XT), gln(44,XT,46,BASE), gln(46,BASE,62,96)), gln(45,44,47,42)],
 'u':[GJ(gln(30,XT,32,BASE), gqb(GP(32,BASE),GP(44,BASE+6),GP(50,96)), gln(50,96,52,XT), gln(52,XT,54,BASE), gln(54,BASE,68,96))],
 't':[GJ(gln(40,34,42,BASE), gqb(GP(42,BASE),GP(52,BASE+4),GP(64,98))), gln(30,58,56,58)],
 'l':[GJ(gqb(GP(30,BASE),GP(24,60),GP(40,ASC+6)), gqb(GP(40,ASC+6),GP(44,60),GP(42,BASE)), gln(42,BASE,60,96))],
 'e':[GJ(gln(32,86,54,84), gqb(GP(54,84),GP(58,66),GP(44,66)), gqb(GP(44,66),GP(30,68),GP(34,88)), gqb(GP(34,88),GP(40,BASE),GP(60,98)))],
 'o':[GJ(garc(48,82,16,26,-20,-20-330,30), gqb(GP(60,64),GP(70,70),GP(66,80)))],
 'a':[GJ(garc(46,82,16,26,-30,-30-320,28), gln(58,58,58,BASE), gln(58,BASE,70,98))],
 'c':[GJ(garc(52,82,18,26,-30,150,26), gqb(GP(38,BASE-8),GP(46,BASE+4),GP(58,100)))],
 'm':[GJ(gln(28,BASE,30,XT+2), gqb(GP(30,XT),GP(40,XT-2),GP(44,72)), gln(44,72,44,BASE), gqb(GP(44,74),GP(52,XT),GP(58,72)), gln(58,72,58,BASE), gqb(GP(58,74),GP(66,XT),GP(70,74)), gln(70,74,72,BASE), gln(72,BASE,82,98))],
 'n':[GJ(gln(30,BASE,32,XT+2), gqb(GP(32,XT),GP(44,XT-4),GP(50,74)), gln(50,74,50,BASE), gqb(GP(50,74),GP(60,XT),GP(66,74)), gln(66,74,68,BASE), gln(68,BASE,80,98))],
 'r':[GJ(gln(30,BASE,32,XT+4), gqb(GP(32,XT+2),GP(40,XT-4),GP(50,66)), gqb(GP(50,66),GP(58,XT),GP(66,70)))],
 's':[GJ(gqb(GP(58,70),GP(42,60),GP(38,74)), gqb(GP(38,74),GP(36,86),GP(52,88)), gqb(GP(52,88),GP(64,92),GP(50,104)), gqb(GP(50,104),GP(40,112),GP(32,104)))],
 'd':[GJ(garc(48,82,16,26,-30,-30-320,28), gqb(GP(60,64),GP(64,40),GP(60,ASC+6)), gqb(GP(60,ASC+6),GP(58,70),GP(60,BASE)), gln(60,BASE,72,98))],
 'p':[GJ(gln(28,DESC,32,XT), gqb(GP(32,XT-2),GP(46,XT-6),GP(52,66)), garc(48,84,16,16,-90,180,26))]
};
const CAPS={
 'A':[gln(30,BASE,50,CAP), gln(50,CAP,70,BASE), gln(38,84,62,84)],
 'E':[gln(64,CAP,34,CAP), gln(34,CAP,34,BASE), gln(34,BASE,64,BASE), gln(34,64,58,64)],
 'I':[gln(50,CAP,50,BASE), gln(36,CAP,64,CAP), gln(36,BASE,64,BASE)],
 'L':[gln(36,CAP,36,BASE), gln(36,BASE,66,BASE)],
 'O':[garc(50,64,22,46,-90,270)],
 'U':[GJ(gln(32,CAP,32,80), garc(50,80,18,30,180,0,26), gln(68,80,68,CAP))],
 'T':[gln(30,CAP,70,CAP), gln(50,CAP,50,BASE)],
 'C':[garc(52,64,22,46,-50,230,30)],
 'P':[gln(34,BASE,34,CAP), GJ(gln(34,CAP,54,CAP), garc(54,40,16,22,-90,90,20), gln(54,62,34,62))],
 'M':[gln(28,BASE,32,CAP), gln(32,CAP,50,74), gln(50,74,68,CAP), gln(68,CAP,72,BASE)]
};
function glyphStrokes(ch){
  if(DIGITS[ch])return DIGITS[ch];
  if(LOWER[ch])return LOWER[ch];
  if(CAPS[ch])return CAPS[ch];
  return [gln(40,BASE,60,CAP)];
}

/* ----- tracé (écriture) ----- */
function showTrace(){
  const {act,sportId}=session;
  const glyph=session.glyphs[session.i];
  const s=SPORTMAP[sportId];
  app.innerHTML=`${topbar("quitPlay()")}
    <div class="play">
      <div class="qbar">${pipsHTML()}</div>
      <div class="screen-head ${s.cls}" style="margin-bottom:12px;border-radius:26px"><h2 style="font-size:22px">⚽ ${act.name}</h2></div>
      <div class="prompt" style="padding-bottom:10px">
        <button class="say-again" onclick="repeatSay()">🔊</button>
        <div class="q">${session.def.q}&nbsp; <span style="color:var(--foot)">${glyph}</span></div>
      </div>
      <div class="trace-wrap">
        <div class="trace-legend"><span class="dot"></span> Départ &nbsp;•&nbsp; suis la flèche ➜</div>
        <canvas id="traceCanvas"></canvas>
        <div class="covermeter"><i id="coverBar"></i></div>
        <div class="trace-tools">
          <button class="btn btn-yellow" onclick="clearTrace()">🧽 Effacer</button>
          <button class="btn btn-green" onclick="validateTrace()">✅ Valider</button>
        </div>
      </div>
    </div>`;
  session.sayText=session.def.say;session.traceAttempts=0;
  setTimeout(()=>{initTrace(glyph);say(session.def.say);},60);
}

let traceState=null;
function initTrace(glyph){
  const cv=$('#traceCanvas');const dpr=Math.min(window.devicePixelRatio||1,2);
  const rect=cv.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(rect.width*dpr));cv.height=Math.max(1,Math.round(rect.height*dpr));
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const W=rect.width,H=rect.height;
  const strokesN=glyphStrokes(glyph);
  const sc=Math.min((W-48)/100,(H-40)/140);
  const ox=(W-100*sc)/2, oy=(H-140*sc)/2;
  const map=p=>({x:ox+p.x*sc,y:oy+p.y*sc});
  const strokes=strokesN.map(seg=>seg.map(map));
  // points de contrôle le long du chemin (dédoublonnés)
  const checks=[];
  strokes.forEach(seg=>seg.forEach(p=>{
    const last=checks[checks.length-1];
    if(!last||Math.hypot(p.x-last.x,p.y-last.y)>7)checks.push({x:p.x,y:p.y,hit:false});
  }));
  traceState={cv,ctx,W,H,sc,ox,oy,strokes,checks,need:checks.length,covered:0,
    drawing:false,last:null,done:false,tol:Math.max(24,20*sc)};
  drawGuide();bindTrace();
}
function drawGuide(){
  const t=traceState;const {ctx,W,H,sc,oy}=t;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f2f8ff';ctx.fillRect(0,0,W,H);
  const ry=y=>oy+y*sc;
  const rule=(y,dash,col)=>{ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.setLineDash(dash);
    ctx.beginPath();ctx.moveTo(12,ry(y));ctx.lineTo(W-12,ry(y));ctx.stroke();ctx.restore();};
  rule(ASC,[4,8],'#e7eef8');rule(XT,[],'#d7e5f5');rule(BASE,[],'#bcd2e9');rule(DESC,[4,8],'#e7eef8');
  t.strokes.forEach(seg=>{
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    // « route » large et claire à suivre
    ctx.strokeStyle='rgba(47,164,91,.18)';ctx.lineWidth=Math.max(16,10*sc);
    ctx.beginPath();seg.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
    // ligne pointillée centrale
    ctx.setLineDash([2,10]);ctx.strokeStyle='rgba(28,122,62,.75)';ctx.lineWidth=3;
    ctx.beginPath();seg.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
    ctx.restore();
    // point de départ
    const s=seg[0];ctx.fillStyle='#0a7d34';ctx.beginPath();ctx.arc(s.x,s.y,Math.max(7,3.4*sc),0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,Math.max(2.4,1.1*sc),0,7);ctx.fill();
    // flèche de direction
    const a=seg[seg.length-2]||s,b=seg[seg.length-1];const an=Math.atan2(b.y-a.y,b.x-a.x);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(an);ctx.fillStyle='#e0402f';
    const A=Math.max(9,4*sc);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-A,-A*0.62);ctx.lineTo(-A,A*0.62);ctx.closePath();ctx.fill();ctx.restore();
  });
}
function bindTrace(){
  const t=traceState;const cv=t.cv;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return {x:p.clientX-r.left,y:p.clientY-r.top};};
  const start=e=>{e.preventDefault();t.drawing=true;t.last=pos(e);ink(t.last);cover(t.last);};
  const move=e=>{if(!t.drawing)return;e.preventDefault();const p=pos(e);segline(t.last,p);t.last=p;cover(p);};
  const end=()=>{t.drawing=false;t.last=null;};
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  function ink(p){const c=t.ctx;c.fillStyle='#1C7A3E';c.beginPath();c.arc(p.x,p.y,Math.max(7,4*t.sc),0,7);c.fill();}
  function segline(a,b){const c=t.ctx;c.strokeStyle='#1C7A3E';c.lineWidth=Math.max(14,8*t.sc);c.lineCap='round';c.lineJoin='round';
    c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();ink(b);}
  function cover(p){
    let changed=false;
    for(const ck of t.checks){if(!ck.hit&&Math.hypot(p.x-ck.x,p.y-ck.y)<=t.tol){ck.hit=true;t.covered++;changed=true;}}
    if(changed){const ratio=t.need?t.covered/t.need:1;$('#coverBar').style.width=Math.min(100,Math.round(ratio*100))+'%';
      if(ratio>=0.72 && !t.done){t.done=true;traceSuccess();}}
  }
}
window.clearTrace=function(){if(!traceState)return;traceState.covered=0;traceState.done=false;traceState.checks.forEach(c=>c.hit=false);$('#coverBar').style.width='0%';drawGuide();sfxTap();};
window.validateTrace=function(){
  if(!traceState)return;
  const ratio=traceState.need?traceState.covered/traceState.need:1;
  session.traceAttempts=(session.traceAttempts||0)+1;
  if(ratio>=0.35 || session.traceAttempts>=2){traceSuccess();}
  else{sfxWrong();say('Continue à suivre le chemin, encore un peu.');}
};
function traceSuccess(){
  if(session._advancing)return;session._advancing=true;
  session.correct++;session.firstTry++;sfxCorrect();miniPop('foot');say('Bravo !');
  setTimeout(()=>{session._advancing=false;nextRound();},1000);
}

/* ----- fin de round / activité ----- */
function nextRound(){
  session.i++;
  if(session.i>=session.total)finishActivity();
  else showRound();
}
function finishActivity(){
  const key=session.sportId+'/'+session.actId;
  const ratio=session.firstTry/session.total;
  const stars = ratio>=0.99?3 : ratio>=0.6?2 : 1;
  game.cups[key]=true;
  game.stars[key]=Math.max(game.stars[key]||0, stars);
  save();
  const newBadges=checkBadges();
  celebrateCup(stars,newBadges);
}
window.quitPlay=function(){stopSay();session=null;go('sport',(session&&session.sportId));};
// fix: quitPlay must remember sport before nulling
window.quitPlay=function(){const sp=session?session.sportId:'basket';stopSay();session=null;go('sport',sp);};

/* =========================================================================
   RÉCOMPENSES / ANIMATIONS
   ========================================================================= */
function screenFlash(kind){
  const f=document.createElement('div');f.className='flash '+(kind==='go'?'go':'no');
  document.body.appendChild(f);setTimeout(()=>f.remove(),520);
}
function starBurst(x,y){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)return;
  const set=['⭐','🌟','✨','💫'];
  for(let i=0;i<10;i++){
    const s=document.createElement('div');s.className='spark';s.textContent=pick(set);
    s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);
    const ang=Math.random()*Math.PI*2,dist=R(40,120);
    const dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist-30;
    if(s.animate)s.animate([
      {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.1)`,opacity:1,offset:.7},
      {transform:`translate(calc(-50% + ${dx*1.15}px),calc(-50% + ${dy+50}px)) scale(.5)`,opacity:0}
    ],{duration:R(700,1000),easing:'cubic-bezier(.2,.8,.3,1)'});
    setTimeout(()=>s.remove(),1000);
  }
}
function mascotReact(happy){
  const m=document.createElement('div');m.className='mascotReact in';
  m.textContent=happy?pick(['🦁','🎉','🙌']):'🙈';
  document.body.appendChild(m);setTimeout(()=>m.remove(),1000);
}
function shootBall(sportId){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)return;
  const map={basket:'basket',foot:'foot',tennis:'tennis'};
  const b=document.createElement('div');b.className='shot';b.innerHTML=svgBall(map[sportId]||'basket',58);
  document.body.appendChild(b);
  if(b.animate)b.animate([
    {transform:'translate(-50%,0) scale(.6) rotate(0deg)',opacity:0},
    {transform:'translate(-50%,-120px) scale(1) rotate(240deg)',opacity:1,offset:.55},
    {transform:'translate(-50%,-220px) scale(.8) rotate(400deg)',opacity:1,offset:.85},
    {transform:'translate(-50%,-205px) scale(.2) rotate(480deg)',opacity:0}
  ],{duration:900,easing:'cubic-bezier(.25,.9,.4,1)'});
  setTimeout(()=>b.remove(),950);
}
function miniPop(sportId){
  const c=CELEBRATE[sportId]||CELEBRATE.basket;
  screenFlash('go');shootBall(sportId);mascotReact(true);
  const d=document.createElement('div');d.className='mini-pop';
  d.innerHTML='<div class="word">'+c.word+'</div>';
  document.body.appendChild(d);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce && d.animate){
    d.animate([
      {transform:'translate(-50%,-50%) scale(.2) rotate(-16deg)',opacity:0},
      {transform:'translate(-50%,-58%) scale(1.25) rotate(6deg)',opacity:1,offset:.5},
      {transform:'translate(-50%,-66%) scale(1) rotate(0deg)',opacity:1,offset:.8},
      {transform:'translate(-50%,-84%) scale(.9)',opacity:0}
    ],{duration:1000,easing:'cubic-bezier(.2,1.3,.4,1)'});
  }
  confetti(16);
  setTimeout(()=>d.remove(),1050);
}
function wrongPop(){screenFlash('no');mascotReact(false);}
function confetti(n=40){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)return;
  const items=['🎉','🎊','⭐','🌟','🏀','⚽','🎾','🏆','💫'];
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='confetti';
    s.textContent=pick(items);
    s.style.left=R(0,100)+'vw';
    s.style.fontSize=R(18,34)+'px';
    const dur=R(18,34)/10;
    s.style.animation='fall '+dur+'s linear forwards';
    s.style.animationDelay=(R(0,6)/10)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),(dur+1)*1000);
  }
}
function celebrateCup(stars,newBadges){
  sfxWin();confetti(60);
  const badgeLine=newBadges.length?`<div class="earn">Nouvelle médaille&nbsp;: ${newBadges.map(b=>b.emoji+' '+b.name).join(' · ')} 🎉</div>`:'';
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="reward">
    <div class="trophy">🏆</div>
    <h2>Coupe gagnée&nbsp;!</h2>
    <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p>Bravo ${game.name}, tu es un vrai champion&nbsp;!</p>
    ${badgeLine}
    <button class="btn btn-green big" onclick="closeReward()">Continuer ▶</button>
  </div>`;
  document.body.appendChild(ov);ov._sp=session?session.sportId:'basket';
  window._reward=ov;
  const msg = 'Bravo '+game.name+' ! Tu as gagné une coupe'+(stars===3?' avec trois étoiles !':' !');
  say(msg);
  // pluie de confettis prolongée
  let k=0;const iv=setInterval(()=>{confetti(20);if(++k>3)clearInterval(iv);},500);
}
window.closeReward=function(){
  const ov=window._reward;const sp=ov?ov._sp:'basket';
  if(ov)ov.remove();
  stopSay();session=null;go('sport',sp);
};

/* =========================================================================
   BONUS : DÉFI DUNK  (3 bonnes réponses d'affilée)
   ========================================================================= */
function afterCorrect(){
  if(session && session.streak>0 && session.streak%3===0){ launchBonus(); }
  else nextRound();
}
let bonusRAF=null, bonusTimer=null;
function launchBonus(){
  stopSay();
  const intro=document.createElement('div');intro.className='bintro';
  intro.innerHTML=`<div class="card"><div class="big">🏀</div><h2>Défi Dunk&nbsp;!</h2>
    <p>Garde le doigt appuyé pour faire <b>monter</b> le ballon, relâche pour le faire descendre. Marque 3 paniers&nbsp;!</p>
    <button class="btn btn-green big" id="bstart">Jouer&nbsp;!</button></div>`;
  document.body.appendChild(intro);
  say('Trois bonnes réponses ! Défi dunk ! Appuie sur l\'écran pour faire monter le ballon dans le panier.');
  $('#bstart').onclick=()=>{intro.remove();startDunk();};
}
function startDunk(){
  const wrap=document.createElement('div');wrap.className='bonus';
  wrap.innerHTML=`<div class="bhead"><div class="title">🏀 Défi Dunk</div>
      <div class="bscore" id="dunkScore">0 / 3</div>
      <button class="bskip" id="dunkSkip">Passer ▶</button></div>
    <canvas id="dunkCanvas"></canvas>
    <div class="bhint">Appuie pour monter&nbsp;•&nbsp;relâche pour descendre</div>`;
  document.body.appendChild(wrap);
  const cv=$('#dunkCanvas');const ctx=cv.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const fit=()=>{const r=cv.getBoundingClientRect();cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);cv._w=r.width;cv._h=r.height;};
  fit();
  const W=()=>cv._w||320, H=()=>cv._h||420;
  const st={ball:{x:W()/2,y:H()-60,vy:0,r:26},press:false,score:0,need:3,hoopPhase:0,over:false,swish:0};
  const g=0.45, thrust=-1.02, maxv=9;
  const press=e=>{if(e&&e.preventDefault)e.preventDefault();st.press=true;};
  const release=e=>{if(e&&e.preventDefault)e.preventDefault();st.press=false;};
  cv.addEventListener('touchstart',press,{passive:false});
  cv.addEventListener('touchend',release);
  cv.addEventListener('mousedown',press);window.addEventListener('mouseup',release);
  $('#dunkSkip').onclick=()=>endDunk(wrap,false);
  const hoop=()=>({cx:W()/2+Math.sin(st.hoopPhase)*(W()*0.22),cy:H()*0.20,rw:46});
  function step(){
    if(st.over)return;
    st.hoopPhase+=0.022;
    const b=st.ball;
    b.vy+=g; if(st.press)b.vy+=thrust; b.vy=Math.max(-maxv,Math.min(maxv,b.vy));
    b.y+=b.vy; b.x=W()/2;
    const floor=H()-b.r-8, ceil=b.r+6;
    if(b.y>floor){b.y=floor;b.vy=0;} if(b.y<ceil){b.y=ceil;b.vy=1;}
    const h=hoop();
    if(st.swish<=0 && Math.abs(b.y-h.cy)<26 && Math.abs(b.x-h.cx)<h.rw*0.75){
      st.score++;st.swish=18;sfxWin();confetti(24);
      const sEl=$('#dunkScore');if(sEl)sEl.textContent=st.score+' / '+st.need;
      b.y=floor;b.vy=0;
      if(st.score>=st.need){st.over=true;setTimeout(()=>endDunk(wrap,true),650);}
    }
    if(st.swish>0)st.swish--;
    draw(h);
    if(!st.over)bonusRAF=requestAnimationFrame(step);
  }
  function draw(h){
    const w=W(),ht=H();
    ctx.clearRect(0,0,w,ht);
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(0,ht-10,w,10);
    ctx.fillStyle='#fff';ctx.fillRect(h.cx-34,h.cy-48,68,40);
    ctx.fillStyle='#F2872B';ctx.fillRect(h.cx-15,h.cy-32,30,18);
    ctx.strokeStyle='#F2872B';ctx.lineWidth=6;ctx.beginPath();
    if(ctx.ellipse)ctx.ellipse(h.cx,h.cy,h.rw,10,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;
    for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(h.cx+i*12,h.cy);ctx.lineTo(h.cx+i*7,h.cy+26);ctx.stroke();}
    const b=st.ball;drawSvgBall(ctx,b.x,b.y,b.r);
    if(st.swish>0){ctx.fillStyle='rgba(255,220,90,'+(st.swish/18)+')';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('SWISH !',h.cx,h.cy-56);}
  }
  wrap._cleanup=()=>{try{cancelAnimationFrame(bonusRAF);}catch(e){}clearTimeout(bonusTimer);window.removeEventListener('mouseup',release);};
  bonusTimer=setTimeout(()=>{if(!st.over){st.over=true;endDunk(wrap,st.score>0);}},35000);
  step();
}
function drawSvgBall(ctx,x,y,r){
  ctx.save();ctx.fillStyle='#F2872B';ctx.strokeStyle='#8a3d0a';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.stroke();
  ctx.restore();
}
function endDunk(wrap,won){
  if(wrap&&wrap._cleanup)wrap._cleanup();
  let sc=0;const sEl=$('#dunkScore');if(sEl)sc=parseInt(sEl.textContent,10)||0;
  game.bonus=(game.bonus||0)+sc;save();
  if(sc>0)confetti(30);
  if(wrap)wrap.remove();
  say(sc>0?('Super ! '+sc+(sc>1?' paniers':' panier')+' ! On continue.'):'On continue !');
  if(session)nextRound(); else go('home');
}

/* =========================================================================
   RÉGLAGES / NAVIGATION
   ========================================================================= */
window.toggleSound=function(stay){game.sound=!game.sound;save();sfxTap();if(stay)go('parents');else refreshTop();};
window.toggleVoice=function(){game.voice=!game.voice;save();if(game.voice)say('Voix activée.');go('parents');};
function refreshTop(){const cur=currentScreen;go(cur.name,cur.arg);}
window.changeName=function(){renderName();};
window.resetProgress=function(){
  if(confirm('Effacer toutes les coupes et recommencer ?')){
    const nm=game.name;game={name:nm,cups:{},stars:{},badges:[],sound:game.sound,voice:game.voice};save();sfxTap();go('home');
  }
};

let currentScreen={name:'home',arg:null};
window.go=function(name,arg){
  currentScreen={name,arg};stopSay();
  if(name==='home')renderHome();
  else if(name==='sport')renderSport(arg);
  else if(name==='cabinet')renderCabinet();
  else if(name==='parents')renderParents();
  else if(name==='name')renderName();
  window.scrollTo(0,0);
};

/* démarrage */
function boot(){
  if(!game.name)renderName();
  else renderHome();
  // enregistrer le service worker (uniquement si servi en http/https)
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  // débloquer l'audio au 1er contact
  const unlock=()=>{ac();if(AC&&AC.state==='suspended')AC.resume();document.removeEventListener('pointerdown',unlock);};
  document.addEventListener('pointerdown',unlock);
}
boot();
